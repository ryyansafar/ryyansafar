<svg xmlns="http://www.w3.org/2000/svg" width="560" height="256" viewBox="0 0 560 256" role="img" aria-label="Animated ASCII-style glove: notes fall onto five fingers, LEDs light and the fingers strike in sequence.">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}

@keyframes n0{0%,5%{transform:translateY(0);opacity:0}6.25%{opacity:1}30%{transform:translateY(104px);opacity:1}31.25%,100%{transform:translateY(104px);opacity:0}}
@keyframes f0{0%,28.75%{transform:translate(0,0)}30.5%{transform:translate(1.5px,10px)}31.5%{transform:translate(-1.5px,14px)}37.5%,100%{transform:translate(0,0)}}
@keyframes l0{0%,26.5%{opacity:0}27.5%,33.75%{opacity:1}37.5%,100%{opacity:0}}
@keyframes r0{0%,30%{transform:scale(.3);opacity:0}30.5%{transform:scale(.4);opacity:1}42.5%,100%{transform:scale(2.2);opacity:0}}
.n0{animation:n0 4s linear infinite}.f0{animation:f0 4s linear infinite}
.l0{animation:l0 4s linear infinite}.r0{animation:r0 4s linear infinite}
@keyframes n1{0%,15%{transform:translateY(0);opacity:0}16.25%{opacity:1}40%{transform:translateY(104px);opacity:1}41.25%,100%{transform:translateY(104px);opacity:0}}
@keyframes f1{0%,38.75%{transform:translate(0,0)}40.5%{transform:translate(1.5px,10px)}41.5%{transform:translate(-1.5px,14px)}47.5%,100%{transform:translate(0,0)}}
@keyframes l1{0%,36.5%{opacity:0}37.5%,43.75%{opacity:1}47.5%,100%{opacity:0}}
@keyframes r1{0%,40%{transform:scale(.3);opacity:0}40.5%{transform:scale(.4);opacity:1}52.5%,100%{transform:scale(2.2);opacity:0}}
.n1{animation:n1 4s linear infinite}.f1{animation:f1 4s linear infinite}
.l1{animation:l1 4s linear infinite}.r1{animation:r1 4s linear infinite}
@keyframes n2{0%,25%{transform:translateY(0);opacity:0}26.25%{opacity:1}50%{transform:translateY(104px);opacity:1}51.25%,100%{transform:translateY(104px);opacity:0}}
@keyframes f2{0%,48.75%{transform:translate(0,0)}50.5%{transform:translate(1.5px,10px)}51.5%{transform:translate(-1.5px,14px)}57.5%,100%{transform:translate(0,0)}}
@keyframes l2{0%,46.5%{opacity:0}47.5%,53.75%{opacity:1}57.5%,100%{opacity:0}}
@keyframes r2{0%,50%{transform:scale(.3);opacity:0}50.5%{transform:scale(.4);opacity:1}62.5%,100%{transform:scale(2.2);opacity:0}}
.n2{animation:n2 4s linear infinite}.f2{animation:f2 4s linear infinite}
.l2{animation:l2 4s linear infinite}.r2{animation:r2 4s linear infinite}
@keyframes n3{0%,35%{transform:translateY(0);opacity:0}36.25%{opacity:1}60%{transform:translateY(104px);opacity:1}61.25%,100%{transform:translateY(104px);opacity:0}}
@keyframes f3{0%,58.75%{transform:translate(0,0)}60.5%{transform:translate(1.5px,10px)}61.5%{transform:translate(-1.5px,14px)}67.5%,100%{transform:translate(0,0)}}
@keyframes l3{0%,56.5%{opacity:0}57.5%,63.75%{opacity:1}67.5%,100%{opacity:0}}
@keyframes r3{0%,60%{transform:scale(.3);opacity:0}60.5%{transform:scale(.4);opacity:1}72.5%,100%{transform:scale(2.2);opacity:0}}
.n3{animation:n3 4s linear infinite}.f3{animation:f3 4s linear infinite}
.l3{animation:l3 4s linear infinite}.r3{animation:r3 4s linear infinite}
@keyframes n4{0%,45%{transform:translateY(0);opacity:0}46.25%{opacity:1}70%{transform:translateY(104px);opacity:1}71.25%,100%{transform:translateY(104px);opacity:0}}
@keyframes f4{0%,68.75%{transform:translate(0,0)}70.5%{transform:translate(1.5px,10px)}71.5%{transform:translate(-1.5px,14px)}77.5%,100%{transform:translate(0,0)}}
@keyframes l4{0%,66.5%{opacity:0}67.5%,73.75%{opacity:1}77.5%,100%{opacity:0}}
@keyframes r4{0%,70%{transform:scale(.3);opacity:0}70.5%{transform:scale(.4);opacity:1}82.5%,100%{transform:scale(2.2);opacity:0}}
.n4{animation:n4 4s linear infinite}.f4{animation:f4 4s linear infinite}
.l4{animation:l4 4s linear infinite}.r4{animation:r4 4s linear infinite}.ring{transform-box:fill-box;transform-origin:center}
</style>
<rect width="560" height="256" rx="10" fill="#f5f0e8"/>

<text x="24" y="20" font-size="12" fill="#6b6e5f">THAALAM // STRIKE THE AIR, DRUM PLAYS</text>
<line x1="40" x2="520" y1="126" y2="126" stroke="#4d5a2a" stroke-width="1.5"/>

<line x1="80" x2="80" y1="26" y2="126" stroke="#cfc9b8" stroke-dasharray="2 5"/>
<text class="n0" x="80" y="24" font-size="14" fill="#b45309" text-anchor="middle">[=]</text>
<circle class="ring r0" cx="80" cy="126" r="14" fill="none" stroke="#b45309" stroke-width="2"/>
<g class="f0">
<rect x="65" y="140" width="30" height="50" rx="14" fill="none" stroke="#111111" stroke-width="2" transform="translate(0,12)"/>
<circle cx="80" cy="166" r="5" fill="#cfc9b8"/>
<circle class="l0" cx="80" cy="166" r="5" fill="#0f766e"/>
</g>
<text x="80" y="240" font-size="12" fill="#6b6e5f" text-anchor="middle">TH</text>
<line x1="180" x2="180" y1="26" y2="126" stroke="#cfc9b8" stroke-dasharray="2 5"/>
<text class="n1" x="180" y="24" font-size="14" fill="#b45309" text-anchor="middle">[=]</text>
<circle class="ring r1" cx="180" cy="126" r="14" fill="none" stroke="#b45309" stroke-width="2"/>
<g class="f1">
<rect x="165" y="140" width="30" height="62" rx="14" fill="none" stroke="#111111" stroke-width="2" />
<circle cx="180" cy="154" r="5" fill="#cfc9b8"/>
<circle class="l1" cx="180" cy="154" r="5" fill="#0f766e"/>
</g>
<text x="180" y="240" font-size="12" fill="#6b6e5f" text-anchor="middle">IN</text>
<line x1="280" x2="280" y1="26" y2="126" stroke="#cfc9b8" stroke-dasharray="2 5"/>
<text class="n2" x="280" y="24" font-size="14" fill="#b45309" text-anchor="middle">[=]</text>
<circle class="ring r2" cx="280" cy="126" r="14" fill="none" stroke="#b45309" stroke-width="2"/>
<g class="f2">
<rect x="265" y="140" width="30" height="62" rx="14" fill="none" stroke="#111111" stroke-width="2" />
<circle cx="280" cy="154" r="5" fill="#cfc9b8"/>
<circle class="l2" cx="280" cy="154" r="5" fill="#0f766e"/>
</g>
<text x="280" y="240" font-size="12" fill="#6b6e5f" text-anchor="middle">MI</text>
<line x1="380" x2="380" y1="26" y2="126" stroke="#cfc9b8" stroke-dasharray="2 5"/>
<text class="n3" x="380" y="24" font-size="14" fill="#b45309" text-anchor="middle">[=]</text>
<circle class="ring r3" cx="380" cy="126" r="14" fill="none" stroke="#b45309" stroke-width="2"/>
<g class="f3">
<rect x="365" y="140" width="30" height="62" rx="14" fill="none" stroke="#111111" stroke-width="2" />
<circle cx="380" cy="154" r="5" fill="#cfc9b8"/>
<circle class="l3" cx="380" cy="154" r="5" fill="#0f766e"/>
</g>
<text x="380" y="240" font-size="12" fill="#6b6e5f" text-anchor="middle">RI</text>
<line x1="480" x2="480" y1="26" y2="126" stroke="#cfc9b8" stroke-dasharray="2 5"/>
<text class="n4" x="480" y="24" font-size="14" fill="#b45309" text-anchor="middle">[=]</text>
<circle class="ring r4" cx="480" cy="126" r="14" fill="none" stroke="#b45309" stroke-width="2"/>
<g class="f4">
<rect x="465" y="140" width="30" height="62" rx="14" fill="none" stroke="#111111" stroke-width="2" />
<circle cx="480" cy="154" r="5" fill="#cfc9b8"/>
<circle class="l4" cx="480" cy="154" r="5" fill="#0f766e"/>
</g>
<text x="480" y="240" font-size="12" fill="#6b6e5f" text-anchor="middle">PI</text>
<rect x="40" y="198" width="480" height="30" rx="8" fill="none" stroke="#cfc9b8" stroke-width="2"/>
<text x="280" y="218" font-size="12" fill="#4d5a2a" text-anchor="middle">STRIKE -> DRUM  |  LED = NEXT  |  BUZZ = TEMPO</text>
</svg>
